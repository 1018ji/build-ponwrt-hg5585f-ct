name: FiberHome HG5585F CT Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      Cache:
        type: choice
        default: 使用缓存
        options: [使用缓存, 只读缓存, 重新编译, 不使用缓存]
      SSH:
        type: choice
        default: 否
        options: [否, 是]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CACHE_MODE: ${{ inputs.Cache || '使用缓存' }}
  CCACHE_DIR: /workdir/openwrt/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Check build validation paths
        run: |
          python3 scripts/tests/test-workflow-paths.py
          python3 scripts/tests/test-incremental.py

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential gcc-multilib g++-multilib autoconf automake \
            bison flex gawk gettext git gperf libelf-dev libncurses-dev libssl-dev libtool \
            libgmp-dev libmpc-dev libmpfr-dev zlib1g-dev libzstd-dev cmake ninja-build \
            ccache curl file jq patch pkgconf python3 python3-setuptools rsync unzip wget \
            zstd device-tree-compiler u-boot-tools squashfs-tools swig texinfo xsltproc
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$(id -gn)" /workdir

      - name: Fetch pinned source and apply patches from new
        run: |
          python3 scripts/prepare.py clone /workdir/openwrt
          ln -s /workdir/openwrt openwrt
          find openwrt/tools openwrt/toolchain -exec touch -h -d @1600000000 {} +
          cp openwrt/configs/hg5585f-ct.config openwrt/.config
          python3 openwrt/scripts/check-hg5585f-offload.py

      - name: Restore downloaded sources
        id: downloads
        if: env.CACHE_MODE != '不使用缓存'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: /workdir/openwrt/dl
          key: hg5585f-dl-v1-${{ github.run_id }}
          restore-keys: hg5585f-dl-v1-

      - name: Fetch latest luci-app-airoha-npu
        working-directory: openwrt
        run: |
          url=$(python3 -c 'import json; print(json.load(open("'"$GITHUB_WORKSPACE"'/source.json"))["vendored_sources"]["luci-app-airoha-npu"]["url"])')
          rm -rf package/luci-app-airoha-npu
          git clone --depth=1 "$url" package/luci-app-airoha-npu
          rm -rf package/luci-app-airoha-npu/.git

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci luci-i18n-base-zh-cn luci-app-pon airoha-pon-debug \
            airoha-ponctl airoha-pond kmod-airoha-xpon kmod-airoha-paged-bosa \
            iperf3 pciutils htop zoneinfo-asia
          if [ "$CACHE_MODE" != '不使用缓存' ]; then
            printf '\nCONFIG_DEVEL=y\nCONFIG_CCACHE=y\nCONFIG_CCACHE_DIR="%s"\n' "$CCACHE_DIR" >> .config
          fi
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/prepare.py" config .config

      - name: Download package sources
        id: download
        working-directory: openwrt
        run: |
          make download -j8
          echo "key=hg5585f-dl-v1-$(find dl -type f -printf '%P %s\n' | LC_ALL=C sort | sha256sum | cut -c1-24)" >> "$GITHUB_OUTPUT"

      - name: Save downloaded sources
        id: save-downloads
        if: (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译') && steps.download.outcome == 'success' && steps.download.outputs.key != steps.downloads.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /workdir/openwrt/dl
          key: ${{ steps.download.outputs.key }}

      - name: Compute tools and toolchain identities
        id: identity
        run: |
          keys=$(python3 scripts/cache-key.py openwrt)
          echo "tools=hg5585f-tools-v1-$(jq -r .tools <<< "$keys")" >> "$GITHUB_OUTPUT"
          echo "toolchain=hg5585f-toolchain-v1-$(jq -r .toolchain <<< "$keys")" >> "$GITHUB_OUTPUT"

      - name: Restore tools
        id: tools
        if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/build_dir/host
          key: ${{ steps.identity.outputs.tools }}

      - name: Restore toolchain
        id: toolchain
        if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/build_dir/toolchain-*
          key: ${{ steps.identity.outputs.toolchain }}

      - name: Restore compiler cache
        if: env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '只读缓存'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: /workdir/openwrt/.ccache
          key: hg5585f-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: hg5585f-ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Optional SSH session
        if: github.event_name == 'workflow_dispatch' && inputs.SSH == '是'
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          limit-access-to-actor: true

      - name: Build tools
        id: build-tools
        working-directory: openwrt
        env:
          RESTORED: ${{ steps.tools.outputs.cache-hit }}
        run: |
          if [ "$RESTORED" = true ]; then
            find staging_dir/host build_dir/host -exec touch -h -d "@$(date +%s)" {} +
          fi
          make -j"$(nproc)" tools/install || make -j1 V=s tools/install

      - name: Replace tools cache after successful rebuild
        if: env.CACHE_MODE == '重新编译' && steps.build-tools.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_KEY: ${{ steps.identity.outputs.tools }}
        run: gh cache delete "$CACHE_KEY" || true

      - name: Save tools
        id: save-tools
        if: steps.build-tools.outcome == 'success' && (env.CACHE_MODE == '重新编译' || (env.CACHE_MODE == '使用缓存' && steps.tools.outputs.cache-hit != 'true'))
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/build_dir/host
          key: ${{ steps.identity.outputs.tools }}

      - name: Build toolchain
        id: build-toolchain
        working-directory: openwrt
        env:
          RESTORED: ${{ steps.toolchain.outputs.cache-hit }}
        run: |
          if [ "$RESTORED" = true ]; then
            find staging_dir/toolchain-* build_dir/toolchain-* -exec touch -h -d "@$(date +%s)" {} +
          fi
          make -j"$(nproc)" toolchain/install || make -j1 V=s toolchain/install

      - name: Replace toolchain cache after successful rebuild
        if: env.CACHE_MODE == '重新编译' && steps.build-toolchain.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_KEY: ${{ steps.identity.outputs.toolchain }}
        run: gh cache delete "$CACHE_KEY" || true

      - name: Save toolchain
        id: save-toolchain
        if: steps.build-toolchain.outcome == 'success' && (env.CACHE_MODE == '重新编译' || (env.CACHE_MODE == '使用缓存' && steps.toolchain.outputs.cache-hit != 'true'))
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/build_dir/toolchain-*
          key: ${{ steps.identity.outputs.toolchain }}

      - name: Build native, WED and NPU firmware
        id: firmware
        working-directory: openwrt
        run: |
          remaining=$((BUILD_STARTED + 345 * 60 - $(date +%s)))
          [ "$remaining" -gt 0 ] || exit 1
          timeout -k 60 "$remaining" make -j"$(nproc)" || {
            result=$?
            [ "$result" -ne 124 ] && [ "$result" -ne 137 ] || exit 1
            remaining=$((BUILD_STARTED + 345 * 60 - $(date +%s)))
            [ "$remaining" -gt 0 ] || exit 1
            timeout -k 60 "$remaining" make -j1 V=s
          }

      - name: Upload built firmware
        id: upload-firmware
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hg5585f-ct-${{ github.run_number }}
          path: |
            openwrt/bin/targets/airoha/an7581/*fiberhome_hg5585f-ct-*.itb
            openwrt/bin/targets/airoha/an7581/*fiberhome_hg5585f-ct-*.bin
            openwrt/bin/targets/airoha/an7581/sha256sums
            openwrt/bin/targets/airoha/an7581/*.buildinfo
            source.json
          if-no-files-found: error

      - name: Validate actual kernel, ROM ABI and image profiles
        id: validation
        if: ${{ !cancelled() && steps.firmware.outcome == 'success' }}
        working-directory: openwrt
        run: |
          set -o pipefail
          bash "$GITHUB_WORKSPACE/scripts/validate-build.sh" 2>&1 | tee "$GITHUB_WORKSPACE/hg5585f-validation.log"

      - name: Upload validation report
        if: ${{ !cancelled() && (steps.validation.outcome == 'success' || steps.validation.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: hg5585f-ct-validation-${{ github.run_number }}
          path: hg5585f-validation.log
          if-no-files-found: error

      - name: Check compiler cache contents
        id: compiler-ready
        if: always() && !cancelled() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
        run: |
          if [ -d "$CCACHE_DIR" ] && [ -n "$(find "$CCACHE_DIR" -type f \
            ! -name stats ! -name ccache.conf ! -name CACHEDIR.TAG \
            ! -path "$CCACHE_DIR/tmp/*" ! -path "$CCACHE_DIR/lock/*" -print -quit)" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save compiler progress
        id: save-compiler
        if: always() && !cancelled() && steps.compiler-ready.outputs.present == 'true' && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /workdir/openwrt/.ccache
          key: hg5585f-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the latest cache in each saved category
        if: always() && !cancelled() && (env.CACHE_MODE == '使用缓存' || env.CACHE_MODE == '重新编译') && (steps.save-downloads.outcome == 'success' || steps.save-tools.outcome == 'success' || steps.save-toolchain.outcome == 'success' || steps.save-compiler.outcome == 'success')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOWNLOADS_SAVED: ${{ steps.save-downloads.outcome }}
          TOOLS_SAVED: ${{ steps.save-tools.outcome }}
          TOOLCHAIN_SAVED: ${{ steps.save-toolchain.outcome }}
          COMPILER_SAVED: ${{ steps.save-compiler.outcome }}
          PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        run: |
          keep_latest() {
            gh cache list --key "$1" --sort created_at --order desc --limit 100 \
              --json id --jq '.[1:][].id' |
            while IFS= read -r cache_id; do gh cache delete "$cache_id"; done
          }
          if [ "$DOWNLOADS_SAVED" = success ]; then keep_latest 'hg5585f-dl-v1-'; fi
          if [ "$TOOLS_SAVED" = success ]; then keep_latest 'hg5585f-tools-v1-'; fi
          if [ "$TOOLCHAIN_SAVED" = success ]; then keep_latest 'hg5585f-toolchain-v1-'; fi
          if [ "$COMPILER_SAVED" = success ]; then keep_latest "hg5585f-ccache-v1-$PLATFORM-"; fi

      - name: Keep the current run and six completed runs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_FILE: hg5585f-ct-builder.yml
        run: |
          gh run list --workflow "$WORKFLOW_FILE" --status completed --limit 200 --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[6:] | .[].databaseId' |
          while IFS= read -r id; do gh run delete "$id"; done
